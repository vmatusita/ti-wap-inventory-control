name: CI

# Portão de qualidade automático (antes só rodava à mão a cada fase — CLAUDE.md
# regra 7). Roda em todo push na main (modo autônomo comita direto) e em qualquer
# PR. O deploy segue na Vercel, com os segredos reais; aqui só validamos.
on:
  push:
    branches: [main]
  pull_request:

# Um push novo no mesmo ref cancela a execução anterior (economiza minutos).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    # Env PLACEHOLDER: o app só lê process.env em runtime (clients Supabase com
    # `!`), então o build NÃO precisa de credenciais reais — valores fake bem
    # formados bastam para o `next build` passar. Segredos reais vivem só na
    # Vercel, que faz o deploy. Nada aqui é sensível.
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: placeholder-service-key
      VIEW_SESSION_SECRET: placeholder-view-secret-para-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          # Node 24 = LTS Ativo. Era 20, que saiu do suporte em abril/2026 e
          # ficava SEIS majors atrás do Node do desenvolvimento (26) — e esse vão
          # não é teórico: em 10/08/2026 ele derrubou o CI por dois pushes com
          # `ReferenceError: sessionStorage is not defined`, porque a Web Storage
          # API só existe como global sem flag a partir do Node 24. O teste
          # daquele caso ficou hermético (traz a própria dublê, ver
          # relatorio-visitado.test.ts), mas a lição maior é que um runner velho
          # esconde defeito ao invés de achar: aqui o CI mentia nos DOIS sentidos
          # — reprovava código são e não exercitava o runtime de verdade.
          #
          # 24 e não 26: 26 ainda é "Current", não LTS (vira LTS em out/2026). CI
          # roda no LTS Ativo — o vão cai de seis majors para dois, e os dois já
          # têm Web Storage, que era a divergência que mordeu. Quando o 26 virar
          # LTS, subir aqui é troca de um número.
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Testes (Vitest — funções puras)
        run: npm run test
      # F29/UXG-07 — o medidor de contraste WCAG existia desde a F19 e rodava só à
      # mão, quando alguém lembrava. Ele lê os MESMOS arquivos que o navegador
      # (node_modules/tailwindcss/theme.css + src/app/globals.css), é Node puro sem
      # dependência, não toca banco e não lê env: entra ANTES do build de propósito,
      # porque custa segundos e reprova cedo. Sai 1 quando um par marcado `exigir`
      # cai abaixo do mínimo — é o próprio script que decide, não este arquivo.
      - name: Contraste (WCAG 2.1 AA)
        run: npm run contraste
      - name: Build (inclui type-check do TypeScript)
        run: npm run build

  # Dívida técnica (item C): rede de teste do BANCO. Antes o CI só validava
  # TypeScript — as migrations, a máquina de estados (trigger) e os saldos de
  # itens não tinham nenhuma verificação automática. Este job sobe um Postgres
  # REAL pelo Supabase CLI, aplica TODAS as migrations de supabase/migrations/ em
  # ordem — a pasta INTEIRA, sem recorte, seja qual for a última (prova que aplicam
  # limpo, inclusive as recriações de RPC que só rodavam à mão em produção) — e roda
  # os roteiros de teste SQL de comportamento, falhando o CI quando algum cenário
  # marca ✗. (Aqui havia "0001→0040" escrito à mão; a faixa envelheceu no primeiro
  # lote de migrations novas e sugeria um recorte que nunca existiu.)
  banco:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # TELEMETRIA DESLIGADA (25/07/2026). O job quebrou com o `supabase init` saindo 1
    # DEPOIS de ter feito o trabalho:
    #     Finished supabase init.
    #     Timeout while shutting down PostHog. Some events may not have been sent.
    #     Error: Process completed with exit code 1
    # Ou seja: o init deu certo e o CLI ainda assim retornou erro, porque o envio de
    # telemetria ao PostHog não conseguiu fechar a tempo no runner. Com `bash -e`, o
    # exit 1 derruba o passo — um CI que quebra por rede de terceiro, não por defeito
    # do repositório (mesma classe do rate limit que fixou a versão do CLI acima).
    #
    # As duas variáveis são as documentadas pelo Supabase (guides/local-development/
    # cli/getting-started §Telemetry): a específica e a convenção ampla `DO_NOT_TRACK`.
    # Com elas o CLI nem tenta falar com o PostHog, então não há flush para estourar.
    # Vale para TODOS os passos do job (init, start, stop) por estar no nível do job.
    env:
      SUPABASE_TELEMETRY_DISABLED: 1
      DO_NOT_TRACK: 1
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          # VERSÃO FIXA, e não `latest` (24/07/2026: o CI do banco quebrou com
          # "Failed to resolve latest Supabase CLI release: rate limit exceeded").
          # `latest` faz a action perguntar à API de releases do GitHub qual é a
          # última — chamada ANÔNIMA no runner, e o limite de 60/h é por IP
          # compartilhado entre todos os jobs da nuvem do Actions: quebra sozinho,
          # sem ninguém mexer no repositório. Com versão fixa a action instala
          # pelo npm e a API nem entra na história.
          #
          # 2.109.1 é a mesma CLI usada no desenvolvimento. Isso conserta um
          # segundo problema, o que o comentário do `supabase start` abaixo já
          # temia: com `latest`, o CI podia subir com uma CLI diferente da do
          # desenvolvedor e falhar por diferença de versão, não por defeito.
          # Para atualizar: `npx supabase@latest --version` e troque o número.
          version: 2.109.1
      - name: Garantir psql (cliente Postgres)
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Inicializar config do Supabase (gera config.toml da versão da CLI)
        run: printf 'n\nn\n' | supabase init
      - name: Subir Postgres local + aplicar TODAS as migrations
        # Stack completo (sem -x): nomes de serviço variam entre versões da CLI e um
        # nome inválido derruba o start. Confiabilidade > velocidade (poucos minutos).
        run: supabase start
      - name: Rodar os roteiros de teste SQL (falha o CI em ✗)
        run: |
          set -o pipefail
          DBURL="postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          # Operador de teste (@wap.ind.br): o trigger handle_new_user cria o profile
          # que os roteiros usam como `criado_por`.
          psql "$DBURL" -v ON_ERROR_STOP=1 -c "insert into auth.users (instance_id, id, aud, role, email, encrypted_password, email_confirmed_at, created_at, updated_at) values ('00000000-0000-0000-0000-000000000000', gen_random_uuid(), 'authenticated', 'authenticated', 'ci@wap.ind.br', '', now(), now(), now());"
          fail=0
          for f in supabase/tests/*.sql; do
            echo "==== $f ===="
            if ! out=$(psql "$DBURL" -v ON_ERROR_STOP=1 -f "$f" 2>&1); then
              echo "$out"; echo "::error::erro de psql em $f"; fail=1; continue
            fi
            echo "$out"
            # Falha REAL = `raise warning '✗ …'` → psql imprime "WARNING:  ✗". O '✗' em
            # NOTICE informativo (ex.: "procure por ✗") NÃO conta como falha.
            if echo "$out" | grep -Eq 'WARNING:.*✗'; then
              echo "::error::roteiro $f marcou ✗ (cenário falhou)"; fail=1
            fi
          done
          exit $fail
      - name: Derrubar o stack local
        if: always()
        run: supabase stop || true
