name: CI

# Portão de qualidade automático (antes só rodava à mão a cada fase — CLAUDE.md
# regra 7). Roda em todo push na main (modo autônomo comita direto) e em qualquer
# PR. O deploy segue na Vercel, com os segredos reais; aqui só validamos.
on:
  push:
    branches: [main]
  pull_request:

# Um push novo no mesmo ref cancela a execução anterior (economiza minutos).
#
# ⚠ MAS SÓ EM PR (F45, 05/09/2026). Até aqui o cancelamento valia também para
# `push: branches: [main]`, e ali ele era um BURACO, não economia: dois pushes
# seguidos na `main` cancelavam o CI do primeiro, e **o commit intermediário ia
# para produção sem validação nenhuma** — a Vercel publica por push, não por
# resultado de CI. Em PR o cancelamento é legítimo: o que interessa é o veredito
# do último commit da branch, e o intermediário nunca vira deploy.
#
# `github.event_name == 'pull_request'` é o único caso em que cancelamos. Em push
# na `main` cada commit tem o CI dele, do começo ao fim — que é o que um
# *required status check* por commit exige para significar alguma coisa.
#
# ⚠ E O GRUPO TAMBÉM MUDA, senão a correção fica pela metade (achado do CI AO VIVO,
# 06/09/2026 — v1.50.1). Só desligar `cancel-in-progress` NÃO basta: com o grupo
# por `ref`, os pushes na `main` continuam disputando a mesma fila, e a regra do
# GitHub é que uma execução que entra na fila **cancela a que estava PENDENTE**.
# Foi o que aconteceu de verdade: no rollout da F45, três pushes seguidos na
# `main` deixaram o run 34005575510 (commit `dab346c`) pendente por 1m23s e
# depois CANCELADO, com `jobs: []` — o commit ficou **sem CI nenhum**. O buraco
# tinha mudado de forma, não sumido.
#
# Com o grupo por SHA no push, cada commit tem fila própria: não disputa, não
# fica pendente, não é cancelado. Em PR o grupo continua por `ref` — é lá que o
# cancelamento é economia legítima, porque o que interessa é o veredito do último
# commit da branch e o intermediário nunca vira deploy.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verificar:
    runs-on: ubuntu-latest
    # Env PLACEHOLDER: o app só lê process.env em runtime (clients Supabase com
    # `!`), então o build NÃO precisa de credenciais reais — valores fake bem
    # formados bastam para o `next build` passar. Segredos reais vivem só na
    # Vercel, que faz o deploy. Nada aqui é sensível.
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: placeholder-service-key
      VIEW_SESSION_SECRET: placeholder-view-secret-para-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node 24 = LTS Ativo. Era 20, que saiu do suporte em abril/2026 e
          # ficava SEIS majors atrás do Node do desenvolvimento (26) — e esse vão
          # não é teórico: em 10/08/2026 ele derrubou o CI por dois pushes com
          # `ReferenceError: sessionStorage is not defined`, porque a Web Storage
          # API só existe como global sem flag a partir do Node 24. O teste
          # daquele caso ficou hermético (traz a própria dublê, ver
          # relatorio-visitado.test.ts), mas a lição maior é que um runner velho
          # esconde defeito ao invés de achar: aqui o CI mentia nos DOIS sentidos
          # — reprovava código são e não exercitava o runtime de verdade.
          #
          # 24 e não 26: 26 ainda é "Current", não LTS (vira LTS em out/2026). CI
          # roda no LTS Ativo — o vão cai de seis majors para dois, e os dois já
          # têm Web Storage, que era a divergência que mordeu. Quando o 26 virar
          # LTS, subir aqui é troca de um número.
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      # F45: dois projetos agora — `puro` (funções puras) e `componentes`
      # (render estático por renderToStaticMarkup, sem dependência nova).
      - name: Testes (Vitest — funções puras e render de componente)
        run: npm run test
      # F29/UXG-07 — o medidor de contraste WCAG existia desde a F19 e rodava só à
      # mão, quando alguém lembrava. Ele lê os MESMOS arquivos que o navegador
      # (node_modules/tailwindcss/theme.css + src/app/globals.css), é Node puro sem
      # dependência, não toca banco e não lê env: entra ANTES do build de propósito,
      # porque custa segundos e reprova cedo. Sai 1 quando um par marcado `exigir`
      # cai abaixo do mínimo — é o próprio script que decide, não este arquivo.
      - name: Contraste (WCAG 2.1 AA)
        run: npm run contraste
      - name: Build (inclui type-check do TypeScript)
        run: npm run build
      # F45 — o gate de ARTEFATO, que existia desde a F13 e que NINGUÉM rodava:
      # `scripts/verificar-actions-build.mjs` não estava no `package.json` nem no
      # CI. Ele existe por causa das ~20 HORAS em que TODAS as Server Actions das
      # rotas logadas ficaram fora do ar em produção (F13, 23/07/2026), por um
      # re-export de TIPO com especificadores dentro de um módulo `'use server'`:
      # o transform emite o identificador em `ensureServerEntryExports([...])`
      # enquanto o `import type` correspondente já foi apagado, e o módulo morre
      # com `ReferenceError` na AVALIAÇÃO. Nada disso falha em lint, test, build
      # ou `next dev` — o GET das rotas continua respondendo 200; só o POST de
      # action quebra.
      #
      # A POSIÇÃO NÃO É LIVRE: ele lê `.next/server`, então tem de vir DEPOIS do
      # build. Sai 0 quando todo identificador registrado tem binding no chunk.
      - name: Gate de artefato — Server Actions com binding (F13)
        run: npm run verificar:actions

  # Dívida técnica (item C): rede de teste do BANCO. Antes o CI só validava
  # TypeScript — as migrations, a máquina de estados (trigger) e os saldos de
  # itens não tinham nenhuma verificação automática. Este job sobe um Postgres
  # REAL pelo Supabase CLI, aplica TODAS as migrations de supabase/migrations/ em
  # ordem — a pasta INTEIRA, sem recorte, seja qual for a última (prova que aplicam
  # limpo, inclusive as recriações de RPC que só rodavam à mão em produção) — e roda
  # os roteiros de teste SQL de comportamento, falhando o CI quando algum cenário
  # marca ✗. (Aqui havia "0001→0040" escrito à mão; a faixa envelheceu no primeiro
  # lote de migrations novas e sugeria um recorte que nunca existiu.)
  banco:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # TELEMETRIA DESLIGADA (25/07/2026). O job quebrou com o `supabase init` saindo 1
    # DEPOIS de ter feito o trabalho:
    #     Finished supabase init.
    #     Timeout while shutting down PostHog. Some events may not have been sent.
    #     Error: Process completed with exit code 1
    # Ou seja: o init deu certo e o CLI ainda assim retornou erro, porque o envio de
    # telemetria ao PostHog não conseguiu fechar a tempo no runner. Com `bash -e`, o
    # exit 1 derruba o passo — um CI que quebra por rede de terceiro, não por defeito
    # do repositório (mesma classe do rate limit que fixou a versão do CLI acima).
    #
    # As duas variáveis são as documentadas pelo Supabase (guides/local-development/
    # cli/getting-started §Telemetry): a específica e a convenção ampla `DO_NOT_TRACK`.
    # Com elas o CLI nem tenta falar com o PostHog, então não há flush para estourar.
    # Vale para TODOS os passos do job (init, start, stop) por estar no nível do job.
    env:
      SUPABASE_TELEMETRY_DISABLED: 1
      DO_NOT_TRACK: 1
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          # VERSÃO FIXA, e não `latest` (24/07/2026: o CI do banco quebrou com
          # "Failed to resolve latest Supabase CLI release: rate limit exceeded").
          # `latest` faz a action perguntar à API de releases do GitHub qual é a
          # última — chamada ANÔNIMA no runner, e o limite de 60/h é por IP
          # compartilhado entre todos os jobs da nuvem do Actions: quebra sozinho,
          # sem ninguém mexer no repositório. Com versão fixa a action instala
          # pelo npm e a API nem entra na história.
          #
          # 2.109.1 é a mesma CLI usada no desenvolvimento. Isso conserta um
          # segundo problema, o que o comentário do `supabase start` abaixo já
          # temia: com `latest`, o CI podia subir com uma CLI diferente da do
          # desenvolvedor e falhar por diferença de versão, não por defeito.
          # Para atualizar: `npx supabase@latest --version` e troque o número.
          version: 2.109.1
      - name: Garantir psql (cliente Postgres)
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Inicializar config do Supabase (gera config.toml da versão da CLI)
        run: printf 'n\nn\n' | supabase init
      - name: Subir Postgres local + aplicar TODAS as migrations
        # Stack completo (sem -x): nomes de serviço variam entre versões da CLI e um
        # nome inválido derruba o start. Confiabilidade > velocidade (poucos minutos).
        run: supabase start
      # F45 — O LOOP SAIU DAQUI. Até aqui ele vivia dentro deste YAML, e por isso
      # não existia forma de rodar os roteiros na máquina do desenvolvedor com o
      # MESMO código: local e CI divergiam por construção, e a divergência só
      # aparecia depois do push. Agora os dois lados chamam o mesmo arquivo —
      # aqui, e `npm run db:test` na mesa. O script é quem carrega `_asserts.sql`
      # antes de cada roteiro (na mesma sessão de psql, senão `pg_temp` some no
      # rollback), pula `_*.sql`, EXIGE a linha `FIM <nome>: N asserções, M
      # falhas` — roteiro que abortava cedo passava VERDE, porque o gate era um
      # `grep` por ✗ e quem morre na terceira asserção não emite ✗ nenhum — e
      # conta `NOTICE:  ✗` como falha, além de `WARNING:  ✗`.
      #
      # `src/lib/ci-passos.test.ts` afirma que este passo chama o script, e não um
      # loop inline: é assim que este tipo de gate morre, alguém "simplifica" o
      # YAML e ninguém percebe por seis meses.
      - name: Rodar os roteiros de teste SQL (falha o CI em ✗ ou em roteiro que abortou)
        run: bash scripts/db/rodar-roteiros.sh
      - name: Derrubar o stack local
        if: always()
        run: supabase stop || true

  # ===========================================================================
  # F46 — O MESMO TRABALHO DO JOB `banco`, SEM O DOCKER DO SUPABASE.
  # ===========================================================================
  # Por que ele existe: o job `banco` acima sobe o STACK INTEIRO do Supabase CLI
  # (`supabase init` + `supabase start`) para usar dele só um Postgres. Custa 3 a 6
  # minutos, já quebrou DUAS vezes por causa externa — as duas cicatrizes estão
  # comentadas lá em cima, o rate limit da API de releases (24/07) e o flush do
  # PostHog (25/07) —, depende de uma versão de CLI fixada à mão, e **não roda na
  # máquina do Johnny**, que não tem Docker (veto de 09/08/2026).
  #
  # Aqui é um `services: postgres:17` do próprio runner: sem Docker do Supabase, sem
  # CLI, sem API de terceiro no caminho crítico.
  #
  # ⚠ O JOB `banco` CONTINUA EXISTINDO, COM O NOME `banco`, E ISSO NÃO É OPCIONAL.
  # Desde 05/09/2026 os *required status checks* da `main` são exatamente `verificar`
  # e `banco`, exigidos PELO NOME. Renomear ou apagar o `banco` deixaria o check
  # exigido sem nunca reportar, e todo PR ficaria preso em "Expected — Waiting for
  # status to be reported" — inclusive o desta fase. Os dois rodam em paralelo, no
  # mesmo commit, chamando o MESMO `scripts/db/rodar-roteiros.sh`: é essa igualdade
  # de veredito que prova que o bootstrap está certo. Promover este a required (e só
  # então remover o antigo) é entrega avulsa, depois de três pushes verdes.
  banco-sem-docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Postgres 17 = o major de PRODUÇÃO (docs/SYSTEM-DESIGN-2026-08-30.md). O
    # `PLANEJAMENTO.md` ainda diz "15+", mas aquilo é de 09/07 e envelheceu. Rodar o
    # CI num major diferente do de produção é um vão que esconde defeito — a mesma
    # lição do Node 20 vs 24 comentada no job `verificar`.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        # Sem isto os passos começam antes de o banco aceitar conexão e o primeiro
        # `psql` morre com "could not connect" — falha de corrida, não de código.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      # O banco dos ROTEIROS. O de determinismo é outro, criado mais abaixo.
      BANCO: estoque
    steps:
      - uses: actions/checkout@v4

      # `psql` não vem no runner por padrão — o job `banco` também o instala.
      - name: Garantir psql (cliente Postgres)
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      # Falha ALTO se o serviço subir num major diferente do de produção: um CI que
      # valida noutro major responde a pergunta errada.
      - name: Conferir o major do Postgres do serviço
        run: |
          set -euo pipefail
          psql -d postgres -tAc 'select version();'
          num=$(psql -d postgres -tAc 'show server_version_num;')
          echo "server_version_num = $num"
          if [ "$((num / 10000))" -ne 17 ]; then
            echo "::error::o serviço subiu no major $((num / 10000)), e produção é 17"
            exit 1
          fi

      # ORDEM EXPLÍCITA, não um glob: `roles` antes de tudo (os grants dos outros três
      # dependem das roles existirem), e a ordem tem de ser legível AQUI, não inferida
      # de nome de arquivo. `ON_ERROR_STOP=1` porque bootstrap que falha pela metade
      # produz um erro de migration cem linhas depois, no lugar errado.
      - name: Criar o banco e aplicar o bootstrap (roles, auth, storage, ledger)
        run: |
          set -euo pipefail
          psql -d postgres -v ON_ERROR_STOP=1 -c "create database $BANCO;"
          for f in supabase/ci/bootstrap-roles.sql \
                   supabase/ci/bootstrap-auth.sql \
                   supabase/ci/bootstrap-storage.sql \
                   supabase/ci/bootstrap-ledger.sql; do
            echo "==== $f ===="
            psql -d "$BANCO" -v ON_ERROR_STOP=1 -q -f "$f"
          done

      # A pasta INTEIRA, sem recorte, seja qual for a última — igual ao job antigo.
      # `sort` no glob: o prefixo é sequencial zero-padded, então a ordem lexicográfica
      # É a ordem de aplicação (a mesma premissa do `migrations.lock.json`).
      # `ON_ERROR_STOP=1` em cada arquivo: a cadeia para no primeiro erro, com o nome
      # do arquivo no log.
      - name: Aplicar TODAS as migrations em ordem, por psql
        run: |
          set -euo pipefail
          n=0
          for f in $(ls supabase/migrations/*.sql | sort); do
            psql -d "$BANCO" -v ON_ERROR_STOP=1 -q -f "$f" || {
              echo "::error::a migration $f falhou"
              exit 1
            }
            n=$((n + 1))
          done
          echo "$n migrations aplicadas em $BANCO"

      # ⚠ ESTE PASSO NÃO É "APLICAR DE NOVO", E A TROCA É DELIBERADA.
      #
      # A ficha da F46 pedia "aplicar de novo, provando idempotência". MEDIDO antes de
      # decidir: impossível neste repositório, e não por pouco — a segunda passada morre
      # na PRIMEIRA migration (`0001_profiles.sql` abre com `create table
      # public.profiles (` sem `if not exists`). São 69 `create policy` sem `drop … if
      # exists`, 45 `create index` sem `if not exists`, 7 `create type`, 7 `create
      # trigger`, 4 `create view` sem `or replace`. As 126 foram escritas para rodar UMA
      # vez, e torná-las idempotentes é EDITAR MIGRATION APLICADA — exatamente o que a
      # trava de hash desta mesma fase passa a proibir, no mesmo commit.
      #
      # Então a fase trocou o critério pela pergunta que "aplicar duas vezes" tentava
      # responder de verdade: A CADEIA PRODUZ SEMPRE O MESMO SCHEMA? Aplica-se do zero
      # num SEGUNDO banco limpo e comparam-se as impressões digitais por classe.
      # Divergência REPROVA. A sonda é a do `docs/RUNBOOK-BANCO.md`, que já traz
      # normalizado o falso-positivo de CRLF de 25/07/2026.
      #
      # Banco SEPARADO de propósito: reaplicar por cima do banco dos roteiros poderia
      # mudá-lo (um `update` de backfill roda de novo) e trocaria a prova do veredito
      # por outra coisa.
      #
      # Nada de `|| true`, nada de `ON_ERROR_STOP` desligado, nada de saída descartada:
      # verificação que não sabe reprovar é o que a F45 existiu para matar.
      - name: Determinismo — a mesma cadeia, do zero, num segundo banco limpo
        run: |
          set -euo pipefail
          psql -d postgres -v ON_ERROR_STOP=1 -c 'create database determinismo;'
          for f in supabase/ci/bootstrap-roles.sql \
                   supabase/ci/bootstrap-auth.sql \
                   supabase/ci/bootstrap-storage.sql \
                   supabase/ci/bootstrap-ledger.sql; do
            psql -d determinismo -v ON_ERROR_STOP=1 -q -f "$f"
          done
          for f in $(ls supabase/migrations/*.sql | sort); do
            psql -d determinismo -v ON_ERROR_STOP=1 -q -f "$f" || {
              echo "::error::a migration $f falhou no banco de determinismo"
              exit 1
            }
          done
          psql -d "$BANCO"     -v ON_ERROR_STOP=1 -tAF'|' -f supabase/ci/impressao-schema.sql > /tmp/fp-a.txt
          psql -d determinismo -v ON_ERROR_STOP=1 -tAF'|' -f supabase/ci/impressao-schema.sql > /tmp/fp-b.txt
          echo "==== impressão digital do schema, por classe ===="
          cat /tmp/fp-a.txt
          if ! diff -u /tmp/fp-a.txt /tmp/fp-b.txt; then
            echo "::error::as duas aplicações da MESMA cadeia produziram schemas diferentes"
            exit 1
          fi
          echo "as duas aplicações produziram schemas idênticos"

      # O MESMO arquivo que o job `banco` chama, e o mesmo que `npm run db:test` chama
      # na mesa. É esse compartilhamento que faz os dois jobs poderem ser comparados: se
      # os vereditos divergirem, a diferença está no bootstrap, nunca no runner.
      # `src/lib/ci-passos.test.ts` afirma que os DOIS jobs chamam este script.
      - name: Rodar os roteiros de teste SQL (falha o CI em ✗ ou em roteiro que abortou)
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/estoque
        run: bash scripts/db/rodar-roteiros.sh
